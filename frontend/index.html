<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nova Esusu — Trustless rotating savings circles on Stellar. Save together, rotate payouts, build reputation."
    />
    <title>Nova Esusu — Trustless Rotating Savings on Stellar</title>
    <script>
      // Apply persisted (or system) theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("nova-theme");
          if (
            t === "dark" ||
            (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
